events {
    worker_connections 1024;
}

http {
    upstream auth_pool {
        server auth1:8000 max_fails=2 fail_timeout=10s;
        server auth2:8000 max_fails=2 fail_timeout=10s;
    }

    upstream booking_pool {
        server booking1:8000 max_fails=2 fail_timeout=10s;
        server booking2:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /health/ {
            proxy_pass http://auth_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /api/auth/ {
            proxy_pass http://auth_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

                location /health/booking/ {
            proxy_pass http://booking_pool/health/;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /api/reservas/ {
            proxy_pass http://booking_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /api/salas/ {
            proxy_pass http://booking_pool;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}